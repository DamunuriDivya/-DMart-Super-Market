{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>DMart - Payment</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .payment-box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            text-align: center;
            color: green;
        }

        .option {
            padding: 12px;
            border: 1px solid #ddd;
            margin: 12px 0;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h1>💳 Payment Options</h1>

    <h3>Select Payment Method</h3>

    <form method="POST" action="{% url 'process_payment' %}">

        {% csrf_token %}

        <div class="option">
            <input type="radio" name="payment_method"
            value="Cash on Delivery" required>
            💵 Cash on Delivery
        </div>

        <div class="option">
            <input type="radio" name="payment_method"
            value="UPI">
            📱 UPI Payment
        </div>

        <div class="option">
            <input type="radio" name="payment_method"
            value="Debit Card">
            💳 Debit Card
        </div>

        <div class="option">
            <input type="radio" name="payment_method"
            value="Credit Card">
            💳 Credit Card
        </div>

        <div class="option">
            <input type="radio" name="payment_method"
            value="Net Banking">
            🏦 Net Banking
        </div>

        <br>

        <button type="submit">Continue Payment</button>

    </form>

</div>

</body>
</html>
