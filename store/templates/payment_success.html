<!DOCTYPE html>
<html>
<head>
    <title>DMart - Payment Success</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .success-box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        h1 {
            color: green;
        }

        .icon {
            font-size: 60px;
        }

        button {
            background: green;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="icon">✅</div>

    <h1>Payment Successful!</h1>

    <h3>Thank You for Shopping with DMart!</h3>

    <p>Your selected payment method:</p>

    <h3>{{ payment_method }}</h3>

    <p>Your order is being processed.</p>

    <a href="/">
        <button>Back to Home</button>
    </a>

</div>

</body>
</html>
